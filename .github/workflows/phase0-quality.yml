name: Phase 0 quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/phase-0-meli-connectivity

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Contract tests
        run: npm test
      - name: Worker and D1 integration tests
        run: npm run test:worker
      - name: Build
        run: npm run build
      - name: Check repository diff
        run: git diff --check
